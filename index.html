<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비트코인 실시간 시세</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js 및 Financial 캔들 플러그인 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.0/dist/chartjs-chart-financial.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; background-color: #0b0e11; color: #e1e3e6; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-5xl space-y-4">
    <!-- Header -->
    <header class="flex justify-between items-center py-2">
      <div class="flex items-center gap-2 font-bold text-lg text-white">
        <span class="text-amber-500">₿</span> 비트코인 실시간 시세
      </div>
      <div class="flex items-center gap-2 text-xs text-emerald-400 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 실시간 연결됨
      </div>
    </header>

    <!-- 1. Top Price Summary Card -->
    <div class="bg-[#181a20] border border-slate-800 rounded-2xl p-6 space-y-6">
      <div>
        <div class="text-xs text-slate-400 mb-1">BTC / KRW · 업비트</div>
        <div class="flex items-baseline gap-3">
          <span id="main-price" class="text-4xl font-extrabold tracking-tight text-white">104,204,000 KRW</span>
        </div>
        <div id="main-change" class="text-sm font-semibold text-blue-500 mt-1">▼ 271,000 (-0.26%)</div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 pt-4 border-t border-slate-800/80 text-xs">
        <div>
          <div class="text-slate-500 mb-1">24h 고가</div>
          <div id="high-24h" class="text-sm font-bold text-slate-200">104,930,000</div>
        </div>
        <div>
          <div class="text-slate-500 mb-1">24h 저가</div>
          <div id="low-24h" class="text-sm font-bold text-slate-200">104,120,000</div>
        </div>
        <div>
          <div class="text-slate-500 mb-1">24h 거래대금</div>
          <div id="acc-price-24h" class="text-sm font-bold text-slate-200">310 억</div>
        </div>
        <div>
          <div class="text-slate-500 mb-1">24h 거래량</div>
          <div id="acc-vol-24h" class="text-sm font-bold text-slate-200">296.05 BTC</div>
        </div>
      </div>
    </div>

    <!-- 2. Interactive Candle Chart Card -->
    <div class="bg-[#181a20] border border-slate-800 rounded-2xl p-6 space-y-4">
      <!-- Timeframe Buttons & MA Checkboxes -->
      <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <!-- Timeframes -->
        <div class="flex items-center gap-1 bg-[#0b0e11] p-1 rounded-xl">
          <button onclick="setUnit('minutes', 1)" id="tf-1m" class="px-3 py-1.5 rounded-lg bg-slate-800 text-white font-medium">1분</button>
          <button onclick="setUnit('minutes', 5)" id="tf-5m" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">5분</button>
          <button onclick="setUnit('minutes', 15)" id="tf-15m" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">15분</button>
          <button onclick="setUnit('minutes', 60)" id="tf-1h" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">1시간</button>
          <button onclick="setUnit('days')" id="tf-days" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">일</button>
          <button onclick="setUnit('weeks')" id="tf-weeks" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">주</button>
          <button onclick="setUnit('months')" id="tf-months" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">월</button>
        </div>

        <!-- MA Indicators -->
        <div class="flex items-center gap-4 text-xs font-mono">
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chk-ma5" checked onchange="toggleDataset(1)" class="accent-amber-500">
            <span class="text-amber-400">― MA5</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chk-ma20" checked onchange="toggleDataset(2)" class="accent-emerald-500">
            <span class="text-emerald-400">― MA20</span>
          </label>
          <label class="flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="chk-ma60" checked onchange="toggleDataset(3)" class="accent-purple-500">
            <span class="text-purple-400">― MA60</span>
          </label>
        </div>
      </div>

      <!-- Canvas Chart -->
      <div class="h-96 w-full relative">
        <canvas id="candleChart"></canvas>
      </div>
    </div>

    <!-- 3. Coin Market Table Card -->
    <div class="bg-[#181a20] border border-slate-800 rounded-2xl p-6">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="text-slate-400 border-b border-slate-800/80">
            <tr>
              <th class="pb-3 pl-2">코인</th>
              <th class="pb-3 text-right">현재가</th>
              <th class="pb-3 text-right">전일대비</th>
              <th class="pb-3 pr-2 text-right">거래대금(24h)</th>
            </tr>
          </thead>
          <tbody id="coin-table-body" class="divide-y divide-slate-800/50">
            <!-- 코인 목록이 JS로 자동 생성됩니다 -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-[11px] text-slate-500">
      데이터 출처: Upbit Open API · 투자 판단의 책임은 본인에게 있습니다.
    </footer>
  </div>

  <script>
    const markets = [
      { code: 'KRW-BTC', name: '비트코인', symbol: 'BTC' },
      { code: 'KRW-ETH', name: '이더리움', symbol: 'ETH' },
      { code: 'KRW-XRP', name: '리플', symbol: 'XRP' },
      { code: 'KRW-SOL', name: '솔라나', symbol: 'SOL' },
      { code: 'KRW-DOGE', name: '도지코인', symbol: 'DOGE' }
    ];

    let currentUnit = 'minutes/1';
    let rawCandles = [];

    // Chart.js 인스턴스 생성
    const ctx = document.getElementById('candleChart').getContext('2d');
    const candleChart = new Chart(ctx, {
      type: 'candlestick',
      data: {
        datasets: [
          {
            label: 'BTC/KRW',
            data: [],
            color: { up: '#ef4444', down: '#3b82f6', unchanged: '#94a3b8' },
            borderColor: { up: '#ef4444', down: '#3b82f6', unchanged: '#94a3b8' }
          },
          { type: 'line', label: 'MA5', data: [], borderColor: '#f59e0b', borderWidth: 1.5, pointRadius: 0 },
          { type: 'line', label: 'MA20', data: [], borderColor: '#10b981', borderWidth: 1.5, pointRadius: 0 },
          { type: 'line', label: 'MA60', data: [], borderColor: '#a855f7', borderWidth: 1.5, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { type: 'time', grid: { color: '#262930' }, ticks: { color: '#848e9c' } },
          y: { grid: { color: '#262930' }, ticks: { color: '#848e9c' } }
        }
      }
    });

    // 이동평균선(MA) 계산 함수
    function calculateMA(period, candles) {
      return candles.map((c, i) => {
        if (i < period - 1) return { x: c.x, y: null };
        let sum = 0;
        for (let j = 0; j < period; j++) sum += candles[i - j].c;
        return { x: c.x, y: sum / period };
      });
    }

    // 캔들 데이터 로드
    async function loadCandles() {
      try {
        const res = await fetch(`https://api.upbit.com/v1/candles/${currentUnit}?market=KRW-BTC&count=60`);
        const data = await res.json();
        const sorted = data.reverse();

        rawCandles = sorted.map(c => ({
          x: new Date(c.candle_date_time_kst).getTime(),
          o: c.opening_price,
          h: c.high_price,
          l: c.low_price,
          c: c.trade_price
        }));

        candleChart.data.datasets[0].data = rawCandles;
        candleChart.data.datasets[1].data = calculateMA(5, rawCandles);
        candleChart.data.datasets[2].data = calculateMA(20, rawCandles);
        candleChart.data.datasets[3].data = calculateMA(60, rawCandles);

        candleChart.update();
      } catch (e) {
        console.error('캔들 로드 실패:', e);
      }
    }

    function toggleDataset(index) {
      candleChart.data.datasets[index].hidden = !candleChart.data.datasets[index].hidden;
      candleChart.update();
    }

    function setUnit(type, min = '') {
      currentUnit = min ? `${type}/${min}` : type;
      loadCandles();
    }

    // 하단 코인 리스트업 및 실시간 데이터 수신
    async function fetchMarketList() {
      const codes = markets.map(m => m.code).join(',');
      const res = await fetch(`https://api.upbit.com/v1/ticker?markets=${codes}`);
      const tickers = await res.json();

      const tbody = document.getElementById('coin-table-body');
      tbody.innerHTML = '';

      tickers.forEach((t, idx) => {
        const info = markets.find(m => m.code === t.market);
        const changeRate = (t.signed_change_rate * 100).toFixed(2);
        const isPlus = t.signed_change_rate > 0;
        const isMinus = t.signed_change_rate < 0;
        const accPriceMillion = Math.round(t.acc_trade_price_24h / 1000000).toLocaleString();

        if (t.market === 'KRW-BTC') {
          document.getElementById('main-price').textContent = `${t.trade_price.toLocaleString()} KRW`;
          document.getElementById('main-change').textContent = `${isPlus ? '▲' : '▼'} ${Math.abs(t.signed_change_price).toLocaleString()} (${isPlus ? '+' : ''}${changeRate}%)`;
          document.getElementById('main-change').className = `text-sm font-semibold mt-1 ${isPlus ? 'text-red-500' : isMinus ? 'text-blue-500' : 'text-slate-300'}`;
          
          document.getElementById('high-24h').textContent = t.high_price.toLocaleString();
          document.getElementById('low-24h').textContent = t.low_price.toLocaleString();
          document.getElementById('acc-price-24h').textContent = `${Math.round(t.acc_trade_price_24h / 100000000).toLocaleString()} 억`;
          document.getElementById('acc-vol-24h').textContent = `${t.acc_trade_volume_24h.toFixed(2)} BTC`;
        }

        const row = document.createElement('tr');
        row.className = 'hover:bg-slate-800/30 transition-colors';
        row.innerHTML = `
          <td class="py-3.5 pl-2 font-medium">
            <span class="text-white">${info.name}</span>
            <span class="text-slate-500 text-[10px] ml-1">${info.symbol}</span>
          </td>
          <td class="py-3.5 text-right font-semibold text-slate-100">₩${t.trade_price.toLocaleString()}</td>
          <td class="py-3.5 text-right font-semibold ${isPlus ? 'text-red-500' : isMinus ? 'text-blue-500' : 'text-slate-400'}">
            ${isPlus ? '▲' : isMinus ? '▼' : ''} ${changeRate}%
          </td>
          <td class="py-3.5 pr-2 text-right text-slate-300 font-mono">${accPriceMillion}백만</td>
        `;
        tbody.appendChild(row);
      });
    }

    // 초기화
    loadCandles();
    fetchMarketList();
    setInterval(fetchMarketList, 3000);
  </script>
</body>
</html>
